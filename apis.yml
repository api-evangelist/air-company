aid: air-company
name: Air Company
description: 'Air Company (AIRCO) is a carbon conversion technology company founded
  in 2017 by Gregory Constantine and Dr. Stafford Sheehan. Its patented Carbon Conversion
  Reactor mimics photosynthesis, combining captured CO2, water and green hydrogen
  with renewable energy to produce carbon-negative alcohols and fully formulated synthetic
  fuels. The company licenses its catalytic process technologies and designs deployable
  production systems, from the container-scale AIRCO MAD Fuel System to the AIRCO SAF
  Factory. Product lines are branded AIRMADE and span sustainable aviation fuel (SAF),
  ethanol, methanol, diesel and rocket fuel, with earlier consumer validation products
  including AIR Vodka and AIR Eau de Parfum. Partners and customers include the U.S.
  Department of Defense, U.S. Air Force, Department of Energy and NASA, alongside aviation
  partners such as Virgin, Air France-KLM, JetBlue and Air Canada; strategic investors
  include Alaska Airlines, Carbon Direct, In-Q-Tel and Toyota Ventures. Air Company
  publishes no public API, developer portal or machine-readable API contract as of
  the 2026-07-31 enrichment pass.'
